name: mobile_flutter
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_ml_kit: ^0.20.0
  camera: ^0.11.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.0
  flutter_tesseract_ocr: ^0.4.31
  image_picker: ^1.2.0
  image_cropper: ^10.0.0+1
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.12.0
  google_mlkit_barcode_scanning: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata_config.json
    - assets/tessdata/eng.traineddata
    - assets/images/daftech_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/daftech_logo.png"
  adaptive_icon_background: "#DDF5E3"
  adaptive_icon_foreground: "assets/images/daftech_logo.png"
